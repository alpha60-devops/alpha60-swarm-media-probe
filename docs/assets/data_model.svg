<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="t d"><title id="t">Internal data model</title><desc id="d">Relationships among torrent_file, process_result, media_info_data, nested track metadata and pipeline_metrics.</desc>
<style>.c{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:10}.h{font:700 17px monospace;fill:#0f172a}.f{font:13px monospace;fill:#334155}.l{stroke:#64748b;stroke-width:2}.note{font:13px sans-serif;fill:#475569}</style>
<rect class="c" x="25" y="35" width="250" height="220"/><text class="h" x="45" y="68">torrent_file</text><text class="f" x="45" y="98">string btih</text><text class="f" x="45" y="122">string name</text><text class="f" x="45" y="146">vector file_paths</text><text class="f" x="45" y="170">vector file_sizes</text><text class="f" x="45" y="194">int64 total_size</text><text class="f" x="45" y="218">path torrent_path</text>
<rect class="c" x="370" y="35" width="260" height="200"/><text class="h" x="390" y="68">process_result</text><text class="f" x="390" y="98">vector media_data_list</text><text class="f" x="390" y="122">vector downloaded_files</text><text class="f" x="390" y="146">size_t success_count</text><text class="f" x="390" y="170">size_t get_fail</text><text class="f" x="390" y="194">size_t extract_fail</text>
<rect class="c" x="715" y="35" width="260" height="250"/><text class="h" x="735" y="68">media_info_data</text><text class="f" x="735" y="98">general metadata...</text><text class="f" x="735" y="128">video_metadata video</text><text class="f" x="735" y="152">audio_metadata audio</text><text class="f" x="735" y="176">subtitle_metadata subtitle</text><text class="note" x="735" y="220">Typed result merged from</text><text class="note" x="735" y="242">MediaInfo and FFprobe JSON</text>
<rect class="c" x="65" y="335" width="250" height="155"/><text class="h" x="85" y="368">pipeline_metrics</text><text class="f" x="85" y="398">btiha_size</text><text class="f" x="85" y="422">unreachable / partial</text><text class="f" x="85" y="446">extracted / percent</text>
<rect class="c" x="405" y="330" width="190" height="145"/><text class="h" x="425" y="363">video_metadata</text><text class="f" x="425" y="393">codec, bitrate</text><text class="f" x="425" y="417">size, fps, color</text>
<rect class="c" x="615" y="330" width="170" height="145"/><text class="h" x="635" y="363">audio_metadata</text><text class="f" x="635" y="393">codec, bitrate</text><text class="f" x="635" y="417">rate, channels</text><text class="f" x="635" y="441">languages</text>
<rect class="c" x="805" y="330" width="170" height="145"/><text class="h" x="825" y="363">subtitle_metadata</text><text class="f" x="825" y="393">languages</text><text class="f" x="825" y="417">format</text>
<line class="l" x1="275" y1="145" x2="370" y2="145"/><text class="note" x="322" y="132" text-anchor="middle">same index</text><line class="l" x1="630" y1="130" x2="715" y2="130"/><line class="l" x1="715" y1="205" x2="500" y2="330"/><line class="l" x1="820" y1="285" x2="700" y2="330"/><line class="l" x1="900" y1="285" x2="890" y2="330"/><line class="l" x1="370" y1="200" x2="315" y2="360"/><text class="note" x="322" y="292">classified into</text>
</svg>
