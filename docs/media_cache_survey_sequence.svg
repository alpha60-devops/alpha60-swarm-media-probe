<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .msg { font-size: 15px; }
    .life { stroke: #555; stroke-width: 2; stroke-dasharray: 8 8; }
    .arrow { stroke: #111; stroke-width: 2; marker-end: url(#arrow); }
    .return { stroke: #555; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 8; }
    .note { fill: #f5f5f5; stroke: #777; stroke-width: 1.5; rx: 6; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>

  <text x="40" y="45" class="title">media_cache_survey: single .sized file sequence</text>

  <rect x="30" y="80" width="170" height="50" class="box"/>
  <rect x="250" y="80" width="170" height="50" class="box"/>
  <rect x="470" y="80" width="170" height="50" class="box"/>
  <rect x="690" y="80" width="170" height="50" class="box"/>
  <rect x="910" y="80" width="170" height="50" class="box"/>
  <rect x="1110" y="80" width="140" height="50" class="box"/>

  <text x="58" y="112" class="label">Survey</text>
  <text x="277" y="112" class="label">Scanner</text>
  <text x="488" y="112" class="label">MediaInfo</text>
  <text x="733" y="112" class="label">ffprobe</text>
  <text x="951" y="112" class="label">FFmpeg</text>
  <text x="1126" y="112" class="label">Report</text>

  <line x1="115" y1="130" x2="115" y2="930" class="life"/>
  <line x1="335" y1="130" x2="335" y2="930" class="life"/>
  <line x1="555" y1="130" x2="555" y2="930" class="life"/>
  <line x1="775" y1="130" x2="775" y2="930" class="life"/>
  <line x1="995" y1="130" x2="995" y2="930" class="life"/>
  <line x1="1180" y1="130" x2="1180" y2="930" class="life"/>

  <line x1="115" y1="175" x2="335" y2="175" class="arrow"/>
  <text x="145" y="165" class="msg">inspect container markers</text>

  <line x1="335" y1="225" x2="115" y2="225" class="return"/>
  <text x="155" y="215" class="msg">moov / moof / EBML result</text>

  <line x1="115" y1="285" x2="555" y2="285" class="arrow"/>
  <text x="245" y="275" class="msg">mediainfo --Output=JSON --Full</text>

  <rect x="610" y="315" width="400" height="75" class="note"/>
  <text x="630" y="342" class="msg">Enforce configurable deadline.</text>
  <text x="630" y="366" class="msg">Capture stdout, stderr, exit code, elapsed time.</text>

  <line x1="555" y1="420" x2="115" y2="420" class="return"/>
  <text x="225" y="410" class="msg">pass / fail / timeout + diagnostics</text>

  <rect x="55" y="455" width="400" height="62" class="note"/>
  <text x="75" y="480" class="msg">If source size ≤ max_archive_size:</text>
  <text x="75" y="503" class="msg">skip redux and record original observations.</text>

  <line x1="115" y1="555" x2="775" y2="555" class="arrow"/>
  <text x="330" y="545" class="msg">oversized: probe duration and bitrate</text>

  <line x1="775" y1="605" x2="115" y2="605" class="return"/>
  <text x="330" y="595" class="msg">estimated target duration</text>

  <line x1="115" y1="665" x2="995" y2="665" class="arrow"/>
  <text x="365" y="655" class="msg">stream-copy remux to temporary redux path</text>

  <line x1="995" y1="715" x2="115" y2="715" class="return"/>
  <text x="405" y="705" class="msg">output path, size, exit status</text>

  <rect x="610" y="742" width="430" height="85" class="note"/>
  <text x="630" y="768" class="msg">If output is too large, reduce duration and retry.</text>
  <text x="630" y="792" class="msg">Accept only nonempty output at or below the limit.</text>
  <text x="630" y="816" class="msg">Then rerun marker scan and MediaInfo.</text>

  <line x1="115" y1="860" x2="1180" y2="860" class="arrow"/>
  <text x="455" y="850" class="msg">append named lists and detailed file observation</text>

  <line x1="1180" y1="910" x2="115" y2="910" class="return"/>
  <text x="450" y="900" class="msg">atomic JSON report updated at survey completion</text>
</svg>
