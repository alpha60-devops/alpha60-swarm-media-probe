<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Cache decision tree</title><desc id="d">Decision flow for cached sample reuse, downloading, extraction and failure accounting.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><style>.n{fill:#f8fafc;stroke:#334155;stroke-width:2}.q{fill:#eef2ff;stroke:#4338ca;stroke-width:2}.ok{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.bad{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.t{font:14px sans-serif;fill:#0f172a}.b{font:700 14px sans-serif;fill:#0f172a}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.lab{font:12px sans-serif;fill:#475569}</style>
<rect class="n" x="350" y="20" width="200" height="55" rx="10"/><text class="b" x="450" y="52" text-anchor="middle">torrent slot begins</text>
<polygon class="q" points="450,105 590,160 450,215 310,160"/><text class="b" x="450" y="155" text-anchor="middle">viable .sized cache?</text><text class="t" x="450" y="177" text-anchor="middle">exists and ≥ minimum</text>
<polygon class="q" points="190,250 310,300 190,350 70,300"/><text class="b" x="190" y="295" text-anchor="middle">downloads enabled?</text>
<rect class="n" x="350" y="275" width="200" height="55" rx="10"/><text class="b" x="450" y="307" text-anchor="middle">extract metadata</text>
<rect class="n" x="70" y="400" width="240" height="60" rx="10"/><text class="b" x="190" y="425" text-anchor="middle">download partial sample</text><text class="t" x="190" y="447" text-anchor="middle">media_downloader</text>
<rect class="bad" x="570" y="275" width="250" height="55" rx="10"/><text class="b" x="695" y="307" text-anchor="middle">record get_fail + placeholders</text>
<polygon class="q" points="450,365 570,415 450,465 330,415"/><text class="b" x="450" y="410" text-anchor="middle">extraction succeeds?</text>
<rect class="ok" x="600" y="390" width="230" height="55" rx="10"/><text class="b" x="715" y="422" text-anchor="middle">record metadata + success</text>
<rect class="bad" x="335" y="485" width="230" height="30" rx="8"/><text class="t" x="450" y="506" text-anchor="middle">remove cache + extract_fail</text>
<path class="e" d="M450 75 V105"/><path class="e" d="M310 160 H190 V250"/><text class="lab" x="240" y="148">no</text><path class="e" d="M450 215 V275"/><text class="lab" x="462" y="245">yes</text><path class="e" d="M310 300 H350"/><text class="lab" x="324" y="288">yes</text><path class="e" d="M70 300 H40 V430 H70"/><text class="lab" x="48" y="290">no</text><path class="e" d="M310 430 H325 V302 H350"/><path class="e" d="M550 302 H570"/><text class="lab" x="557" y="290">download fails</text><path class="e" d="M450 330 V365"/><path class="e" d="M570 415 H600"/><text class="lab" x="580" y="403">yes</text><path class="e" d="M450 465 V485"/><text class="lab" x="462" y="477">no</text>
</svg>
