<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">Layered architecture</title><desc id="d">Main orchestration calls parsing, acquisition, extraction and enrichment modules, which depend on operating system tools and libraries.</desc>
<style>.layer{stroke:#334155;stroke-width:2;rx:14}.title{font:700 19px sans-serif;fill:#0f172a}.label{font:15px sans-serif;fill:#334155}.small{font:13px sans-serif;fill:#475569}</style>
<rect class="layer" fill="#f8fafc" x="70" y="25" width="760" height="70"/><text class="title" x="450" y="55" text-anchor="middle">Orchestration</text><text class="label" x="450" y="80" text-anchor="middle">main.cpp — CLI, policy, control flow, counters, signals</text>
<rect class="layer" fill="#eef2ff" x="70" y="125" width="180" height="130"/><text class="title" x="160" y="160" text-anchor="middle">Parsing</text><text class="label" x="160" y="190" text-anchor="middle">torrent_parser</text><text class="small" x="160" y="220" text-anchor="middle">torrent_file</text>
<rect class="layer" fill="#ecfeff" x="270" y="125" width="180" height="130"/><text class="title" x="360" y="160" text-anchor="middle">Acquisition</text><text class="label" x="360" y="190" text-anchor="middle">media_downloader</text><text class="small" x="360" y="220" text-anchor="middle">cache + .sized</text>
<rect class="layer" fill="#f0fdf4" x="470" y="125" width="180" height="130"/><text class="title" x="560" y="160" text-anchor="middle">Extraction</text><text class="label" x="560" y="190" text-anchor="middle">media_info_extractor</text><text class="small" x="560" y="220" text-anchor="middle">media_info_data</text>
<rect class="layer" fill="#fff7ed" x="670" y="125" width="160" height="130"/><text class="title" x="750" y="160" text-anchor="middle">Reporting</text><text class="label" x="750" y="190" text-anchor="middle">enrichment</text><text class="small" x="750" y="220" text-anchor="middle">JSON + metrics</text>
<rect class="layer" fill="#f1f5f9" x="70" y="300" width="760" height="130"/><text class="title" x="450" y="335" text-anchor="middle">External runtime dependencies</text><text class="label" x="180" y="375" text-anchor="middle">libtorrent</text><text class="label" x="330" y="375" text-anchor="middle">OpenSSL</text><text class="label" x="460" y="375" text-anchor="middle">RapidJSON</text><text class="label" x="600" y="375" text-anchor="middle">MediaInfo</text><text class="label" x="730" y="375" text-anchor="middle">FFprobe</text><text class="small" x="450" y="405" text-anchor="middle">filesystem, process pipes, signals, and disk I/O</text>
</svg>
