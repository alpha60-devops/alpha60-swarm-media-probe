<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Pipeline sequence</title><desc id="d">Sequence from main through parser, cache/downloader, extractor and enrichment.</desc>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><style>.actor{fill:#f8fafc;stroke:#334155;stroke-width:2}.name{font:700 15px sans-serif;fill:#0f172a}.life{stroke:#94a3b8;stroke-dasharray:6 5}.msg{stroke:#475569;stroke-width:2;marker-end:url(#m)}.txt{font:13px sans-serif;fill:#334155}</style>
<g><rect class="actor" x="20" y="20" width="130" height="45"/><text class="name" x="85" y="48" text-anchor="middle">main</text><line class="life" x1="85" y1="65" x2="85" y2="590"/></g>
<g><rect class="actor" x="210" y="20" width="140" height="45"/><text class="name" x="280" y="48" text-anchor="middle">torrent_parser</text><line class="life" x1="280" y1="65" x2="280" y2="590"/></g>
<g><rect class="actor" x="410" y="20" width="140" height="45"/><text class="name" x="480" y="48" text-anchor="middle">cache/downloader</text><line class="life" x1="480" y1="65" x2="480" y2="590"/></g>
<g><rect class="actor" x="610" y="20" width="150" height="45"/><text class="name" x="685" y="48" text-anchor="middle">metadata extractor</text><line class="life" x1="685" y1="65" x2="685" y2="590"/></g>
<g><rect class="actor" x="820" y="20" width="150" height="45"/><text class="name" x="895" y="48" text-anchor="middle">enrichment</text><line class="life" x1="895" y1="65" x2="895" y2="590"/></g>
<line class="msg" x1="85" y1="105" x2="280" y2="105"/><text class="txt" x="180" y="95" text-anchor="middle">parse_all_torrents()</text>
<line class="msg" x1="280" y1="145" x2="85" y2="145"/><text class="txt" x="180" y="135" text-anchor="middle">vector&lt;torrent_file&gt;</text>
<line class="msg" x1="85" y1="205" x2="480" y2="205"/><text class="txt" x="280" y="195" text-anchor="middle">find cached .sized file</text>
<line class="msg" x1="480" y1="245" x2="85" y2="245"/><text class="txt" x="280" y="235" text-anchor="middle">cache hit / miss</text>
<line class="msg" x1="85" y1="300" x2="480" y2="300"/><text class="txt" x="280" y="290" text-anchor="middle">almost_nothing() on miss</text>
<line class="msg" x1="480" y1="340" x2="85" y2="340"/><text class="txt" x="280" y="330" text-anchor="middle">optional&lt;path&gt;</text>
<line class="msg" x1="85" y1="400" x2="685" y2="400"/><text class="txt" x="385" y="390" text-anchor="middle">extract() cached sample</text>
<line class="msg" x1="685" y1="440" x2="85" y2="440"/><text class="txt" x="385" y="430" text-anchor="middle">optional&lt;media_info_data&gt;</text>
<line class="msg" x1="85" y1="505" x2="895" y2="505"/><text class="txt" x="490" y="495" text-anchor="middle">build_output() + write_output()</text>
<line class="msg" x1="895" y1="545" x2="85" y2="545"/><text class="txt" x="490" y="535" text-anchor="middle">JSON report status</text>
</svg>
